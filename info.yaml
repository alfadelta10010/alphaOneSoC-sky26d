# Tiny Tapeout project information
project:
  title:        "AlphaOneSoC"      # Project title
  author:       "Abhiram Dasika"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "RV32IMAC RISC-V SoC that runs from QSPI flash and PSRAM, with a UART, GPIO and an SPI transmitter"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     62500000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "3x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_alfadelta10010_alphaone_soc"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_alfadelta10010_alphaone_soc.v"
    - "alphaone_soc.v"
    - "fyracore.v"
    - "alu.v"
    - "branchCtrl.v"
    - "clint.v"
    - "compressed_decoder.v"
    - "controller.v"
    - "csr.v"
    - "decoder.v"
    - "muldiv.v"
    - "pmp.v"
    - "regFile.v"
    - "rf_top.v"
    - "signExt.v"
    - "qspi_ctrl.v"
    - "mem_ctrl.v"
    - "soc_bus.v"
    - "uart.v"
    - "gpio.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "QSPI read-latency strap (during reset) / GPIO in 0"
  ui[1]: "GPIO in 1"
  ui[2]: "GPIO in 2"
  ui[3]: "UART RX"
  ui[4]: "GPIO in 4"
  ui[5]: "GPIO in 5"
  ui[6]: "GPIO in 6"
  ui[7]: "GPIO in 7"

  # Outputs
  uo[0]: "GPIO out 0"
  uo[1]: "GPIO out 1 / SPI MOSI"
  uo[2]: "GPIO out 2"
  uo[3]: "GPIO out 3 / SPI SCK"
  uo[4]: "UART TX"
  uo[5]: "UART RTS#"
  uo[6]: "GPIO out 6"
  uo[7]: "GPIO out 7"

  # Bidirectional pins
  uio[0]: "QSPI CS0 (flash)"
  uio[1]: "QSPI SD0"
  uio[2]: "QSPI SD1"
  uio[3]: "QSPI SCK"
  uio[4]: "QSPI SD2"
  uio[5]: "QSPI SD3"
  uio[6]: "QSPI CS1 (PSRAM A)"
  uio[7]: "QSPI CS2 (PSRAM B)"

# Do not change!
yaml_version: 6
